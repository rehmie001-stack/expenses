services:
  - type: web
    name: mall-expenses-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: mall-expenses-db
          property: connectionString

databases:
  - name: mall-expenses-db
    plan: free
